<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAFA"/>

  <!-- Main Calendar Grid -->
  <rect x="100" y="100" width="600" height="400" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Calendar Header -->
  <rect x="100" y="100" width="600" height="80" rx="24" fill="#0A1A2F"/>
  <rect x="100" y="156" width="600" height="24" fill="#0A1A2F"/>

  <!-- Calendar Title -->
  <text x="130" y="145" fill="#FFFFFF" font-family="Inter" font-weight="600" font-size="18">Planning Équipe - Semaine 42</text>

  <!-- Days Header -->
  <rect x="100" y="180" width="600" height="40" fill="#F8F9FA"/>
  <line x1="200" y1="180" x2="200" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="300" y1="180" x2="300" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="400" y1="180" x2="400" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="500" y1="180" x2="500" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="600" y1="180" x2="600" y2="220" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Day Labels -->
  <text x="150" y="205" fill="#6B7280" font-family="Inter" font-weight="500" font-size="12" text-anchor="middle">LUN</text>
  <text x="250" y="205" fill="#6B7280" font-family="Inter" font-weight="500" font-size="12" text-anchor="middle">MAR</text>
  <text x="350" y="205" fill="#6B7280" font-family="Inter" font-weight="500" font-size="12" text-anchor="middle">MER</text>
  <text x="450" y="205" fill="#6B7280" font-family="Inter" font-weight="500" font-size="12" text-anchor="middle">JEU</text>
  <text x="550" y="205" fill="#6B7280" font-family="Inter" font-weight="500" font-size="12" text-anchor="middle">VEN</text>
  <text x="650" y="205" fill="#6B7280" font-family="Inter" font-weight="500" font-size="12" text-anchor="middle">SAM</text>

  <!-- Schedule Blocks -->
  <!-- Marie - Morning shifts -->
  <rect x="120" y="240" width="60" height="30" rx="6" fill="#F2E94E" opacity="0.9"/>
  <text x="150" y="258" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Marie</text>

  <rect x="220" y="240" width="60" height="30" rx="6" fill="#F2E94E" opacity="0.9"/>
  <text x="250" y="258" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Marie</text>

  <rect x="420" y="240" width="60" height="30" rx="6" fill="#F2E94E" opacity="0.9"/>
  <text x="450" y="258" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Marie</text>

  <!-- Jean - Afternoon shifts -->
  <rect x="120" y="280" width="60" height="30" rx="6" fill="#A8E6CF" opacity="0.9"/>
  <text x="150" y="298" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Jean</text>

  <rect x="320" y="280" width="60" height="30" rx="6" fill="#A8E6CF" opacity="0.9"/>
  <text x="350" y="298" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Jean</text>

  <rect x="520" y="240" width="60" height="30" rx="6" fill="#A8E6CF" opacity="0.9"/>
  <text x="550" y="258" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Jean</text>

  <!-- Sophie - Management -->
  <rect x="220" y="320" width="60" height="30" rx="6" fill="#0A1A2F" opacity="0.1"/>
  <rect x="220" y="320" width="60" height="30" rx="6" fill="none" stroke="#0A1A2F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="250" y="338" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Sophie</text>

  <rect x="320" y="320" width="60" height="30" rx="6" fill="#0A1A2F" opacity="0.1"/>
  <rect x="320" y="320" width="60" height="30" rx="6" fill="none" stroke="#0A1A2F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="350" y="338" fill="#0A1A2F" font-family="Inter" font-weight="500" font-size="10" text-anchor="middle">Sophie</text>

  <!-- AI Optimization Indicator -->
  <circle cx="650" cy="130" r="8" fill="#F2E94E"/>
  <path d="M646 130L648 132L654 126" stroke="#0A1A2F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Productivity Stats -->
  <rect x="520" y="360" width="160" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="540" y="380" fill="#0A1A2F" font-family="Inter" font-weight="600" font-size="12">Optimisation IA</text>
  <text x="540" y="400" fill="#6B7280" font-family="Inter" font-weight="400" font-size="10">+32% productivité</text>
  <text x="540" y="415" fill="#6B7280" font-family="Inter" font-weight="400" font-size="10">-18% coûts RH</text>
  <text x="540" y="430" fill="#6B7280" font-family="Inter" font-weight="400" font-size="10">100% conformité</text>

  <!-- Team Icons -->
  <circle cx="160" y="380" r="16" fill="#F2E94E" opacity="0.2"/>
  <circle cx="160" y="380" r="12" fill="#F2E94E"/>
  <text x="160" y="385" fill="#0A1A2F" font-family="Inter" font-weight="600" font-size="10" text-anchor="middle">M</text>

  <circle cx="200" y="380" r="16" fill="#A8E6CF" opacity="0.2"/>
  <circle cx="200" y="380" r="12" fill="#A8E6CF"/>
  <text x="200" y="385" fill="#0A1A2F" font-family="Inter" font-weight="600" font-size="10" text-anchor="middle">J</text>

  <circle cx="240" y="380" r="16" fill="#0A1A2F" opacity="0.2"/>
  <circle cx="240" y="380" r="12" fill="#0A1A2F"/>
  <text x="240" y="385" fill="#FFFFFF" font-family="Inter" font-weight="600" font-size="10" text-anchor="middle">S</text>

  <!-- Floating Elements -->
  <circle cx="750" cy="150" r="3" fill="#F2E94E" opacity="0.6"/>
  <circle cx="50" cy="300" r="2" fill="#A8E6CF" opacity="0.8"/>
  <circle cx="80" cy="450" r="4" fill="#0A1A2F" opacity="0.3"/>

  <!-- Grid Lines -->
  <line x1="200" y1="220" x2="200" y2="500" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="220" x2="300" y2="500" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="220" x2="400" y2="500" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <line x1="500" y1="220" x2="500" y2="500" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="220" x2="600" y2="500" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
</svg>